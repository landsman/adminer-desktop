<!doctype html>
<meta charset="utf-8">
<title>Adminer Desktop</title>
<!-- The native window shows this from the first frame while the server starts, so it covers
     the pre-paint flash; the app replaces it once frankenphp answers. The <link> keeps the
     page standalone-renderable in an editor -- at runtime the launcher inlines the CSS. -->
<link rel="stylesheet" href="loader.css">
<div class="spinner"></div>
<!-- Report to the launcher when this page has parsed, so it can log when the loader actually
     rendered vs when it was told to (adLoaderShown is bound in main.go). Diagnostic only. -->
<script>
	document.addEventListener("DOMContentLoaded", function () {
		if (window.adLoaderShown) {
			window.adLoaderShown();
		}
	});
</script>
