version: 2

updates:
  # The semgrep pin, which lives in .github/semgrep.Dockerfile because that is the
  # only syntax Dependabot parses — `directory` is the folder, the file is found by
  # name. It points at ghcr.io/landsman/semgrep-mirror, so the versions offered here
  # are the ones landsman/config has actually published, never a semgrep release
  # that has not been mirrored yet.
  - package-ecosystem: docker
    directory: /.github
    schedule:
      interval: weekly
    # A scanner picked up the day it shipped can turn a green build red for reasons
    # that are not ours, which is what pinning it exists to prevent in the first
    # place. A week is enough for a bad release to be yanked first.
    cooldown:
      default-days: 7

  # Actions are referenced by major tag here (actions/checkout@v5, setup-go@v6), and
  # Dependabot moves the major rather than rewriting it into a SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
