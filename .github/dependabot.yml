version: 2

# Four manifests, four ecosystems. composer lives in app/, not the root — see CLAUDE.md.
# One grouped PR per ecosystem per week: this is a one-maintainer repo, and a PR per
# package would mean five open at a time for a repo with two runtime dependencies.
#
# Not covered here, because dependabot cannot see them: adminer, frankenphp, composer,
# phpstan and golangci-lint are version pins in the Makefile, checksum-verified.
#
# Every entry waits a week before proposing a release (`cooldown`). A compromised
# package is caught and yanked within days, and the whole point of automating a bump is
# that nobody reads the diff — so the automation must not be the thing that races the
# registry. Cooldown applies to version updates only: a CVE fix still arrives at once.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      composer:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ["*"]
