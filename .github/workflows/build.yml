name: build

on:
  # No push trigger. Everything reaches main as a squash-merge of a pull request that was
  # already linted green, so a push event only ever re-runs the checks the merge was allowed
  # on. The trade is that a commit pushed straight to main is never checked — which is the
  # honest cost of never opening a pull request for it.
  pull_request:
    # ready_for_review is not in the default set, so marking a draft ready would
    # otherwise never trigger anything and the checks would sit there as skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      build:
        description: Also build and package all three platforms
        type: boolean
        default: false
      tag:
        description: Existing tag — build it and attach the packages to its release
        type: string

jobs:
  # Kept separate from build so a lint failure reads as a lint failure rather than as a
  # broken build, and so it reports in ~2 minutes instead of waiting on the matrix.
  # A draft PR is work in progress and says so; running the checks on every push to one
  # spends minutes to tell you about code you already know is unfinished. And a manual
  # dispatch asks for packages off a commit that has already been through this on its way
  # to main, so it is the pull request and nothing else that gets linted.
  quality:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # golangci-lint type-checks, so it needs what the package needs to compile. Same
      # target `make install` runs on a Linux checkout, so the recipe lives in one place.
      - name: Install webview build dependencies
        run: make linux-deps

      - name: Cache pinned downloads
        uses: actions/cache@v6
        with:
          path: |
            bin
            .cache
          key: pinned-frankenphp-linux-x86_64-${{ hashFiles('Makefile') }}

      # phpstan reads app/adminer.php for adminer's own symbols, so the downloads have
      # to be in place before it can say anything useful.
      - run: make fetch FRANKEN_ASSET=frankenphp-linux-x86_64

      # php syntax and style, phpstan, golangci-lint, gofmt, go vet, shell syntax.
      - run: make qa FRANKEN_ASSET=frankenphp-linux-x86_64

      # Every native-shell string translated in every locale. Deliberately here and not in
      # `qa`: adding an English string is the first half of the work, and a local `qa` that
      # goes red until all five translations exist would be red for the whole of the second
      # half. A pull request is where the pair has to be complete.
      - run: make i18n-check FRANKEN_ASSET=frankenphp-linux-x86_64

      # shellcheck is already on the runner and says far more than `sh -n` does. `qa` globs
      # cli/*.sh into the same check, but only reaches shellcheck when it is installed —
      # here it always is, so this is the run that cannot silently degrade to `sh -n`.
      - run: shellcheck check.sh cli/*.sh

      # Security rules for php, go and leaked secrets. Docker is on the runner and the
      # Makefile pulls semgrep from the public GHCR mirror, so this needs nothing
      # installed and no credentials.
      - run: make security

  # Manual only. Three platforms per commit is minutes spent to learn that a one-line PHP
  # change is still fine, and macOS runners bill at 10x. Run it from the Actions tab: tick
  # the build box for artifacts, or name an existing tag to build that and attach the
  # packages to its release.
  build:
    if: github.event_name == 'workflow_dispatch' && (inputs.build || inputs.tag != '')
    strategy:
      # One red platform should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          # macos-15 runners are Apple Silicon, matching frankenphp-mac-arm64. On an
          # Intel runner the downloaded binary would be the wrong architecture.
          - os: macos-15
            asset: frankenphp-mac-arm64
            package: zip
            platform: macos-arm64
          # Both linux packages off one build: `deb` only re-roots what `dist` already
          # staged, so it costs a dpkg-deb call rather than a second compile.
          - os: ubuntu-24.04
            asset: frankenphp-linux-x86_64
            package: tarball deb
            platform: linux-x86_64
          - os: windows-2025
            asset: frankenphp-windows-x86_64.zip
            package: windows
            platform: windows-x86_64

    runs-on: ${{ matrix.os }}
    # One environment per platform, so the Environments sidebar reads as three independent
    # deployment states rather than one build that was either green or not. `matrix.platform`
    # and not `matrix.os`, which names the runner image and so changes at the next bump —
    # and renaming an environment loses its deployment history.
    environment: ${{ matrix.platform }}
    defaults:
      run:
        # The Makefile is written for a POSIX shell; bash ships with the windows runner.
        shell: bash

    steps:
      # An empty ref is the default branch, so this is the same checkout when no tag is
      # named. Unshallow for the tags either way: VERSION is `git describe`, and the .deb
      # takes its version from it. Without the tags that is "dev", which DEB_VERSION
      # strips to nothing and dpkg-deb then refuses.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # webview is cgo, and on linux that means the system GTK and WebKit headers. macOS
      # and windows get theirs from the platform SDK and WebView2, already on the runner.
      # The apt install + webkit2gtk-4.0 shim live in one place: the linux-deps target.
      - name: Install webview build dependencies
        if: runner.os == 'Linux'
        run: make linux-deps

      # frankenphp is a ~180 MB download. It is pinned, so the key only has to change
      # when the pinned version does.
      - name: Cache pinned downloads
        uses: actions/cache@v6
        with:
          path: |
            bin
            .cache
          key: pinned-${{ matrix.asset }}-${{ hashFiles('Makefile') }}

      - run: make fetch FRANKEN_ASSET=${{ matrix.asset }}

      # Before anything else: a mismatch means the release was re-uploaded or the
      # download was tampered with, and neither should reach a build. The runner ships gh,
      # but not logged in — the frankenphp provenance check reads the attestation over the
      # API, so it needs a token. The default one is enough: php/frankenphp is public and
      # this only ever reads.
      - run: make verify FRANKEN_ASSET=${{ matrix.asset }}
        env:
          GH_TOKEN: ${{ github.token }}

      # No `qa` here: this job packages, and the linters have nothing to say about a
      # commit that is already on main. `check` stays — it boots the thing being packaged.
      # ~2 minutes, and deliberately not shortened. The point is to outlast the ordinary
      # 60s server write timeout, so a faster run would stop proving the thing it exists
      # to prove.
      - run: make check FRANKEN_ASSET=${{ matrix.asset }}

      # codesign, notarytool, stapler and ditto all ship with the Xcode command line tools
      # that are already on the runner, so signing adds no install and no third-party action
      # — only a certificate, which has to come from a paid Apple Developer Program
      # membership and so lives in this environment's secrets.
      #
      # In a script rather than inline here, so the signing path can be rehearsed on a laptop
      # before it is debugged on a runner that bills at 10x — and so shellcheck sees it, which
      # nothing in a YAML `run:` block ever is. Skipped when the secret is absent: a fork, or a
      # dispatch from before the certificate existed, then keeps the ad-hoc signature
      # `make bundle` applies regardless.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: make keychain

      # Empty on every platform but macOS, and empty there too until the secret exists, which
      # is what makes `bundle` fall back to ad-hoc rather than fail.
      - run: make ${{ matrix.package }} FRANKEN_ASSET=${{ matrix.asset }}
        env:
          MACOS_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}

      # Its own step rather than swapping matrix.package to `notarize`, so a run without the
      # notary key still uploads a signed zip instead of dying on a missing credential. The
      # cost is that the phony bundle > zip chain runs a second time; fold it into
      # matrix.package once the secrets are permanent.
      - name: Notarize and staple
        if: runner.os == 'macOS' && env.NOTARY_KEY_ID != ''
        env:
          MACOS_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          NOTARY_KEY_B64: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY_B64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          make notarize FRANKEN_ASSET=${{ matrix.asset }} NOTARY_KEY="$RUNNER_TEMP/notary.p8"

      # One glob for all three platforms, because every package is now named
      # adminer-desktop_<version>_<os>-<arch>.<ext> (see PKG in the Makefile). It picks up
      # the .deb beside the tarball and never the bare `build/adminer-desktop` binary,
      # which has no underscore.
      # macOS is signed, and notarized and stapled when the secrets are set, so it opens on
      # a double-click. Windows is still bare and still shows SmartScreen — the same problem
      # wanting a different (and dearer) certificate, and nobody has asked yet.
      - uses: actions/upload-artifact@v7
        with:
          name: adminer-desktop-${{ matrix.platform }}
          path: build/adminer-desktop_*
          if-no-files-found: error

  # Attaches what the matrix built to the release that already exists for the named tag —
  # draft or published, `gh` finds either. It never creates one: the release and its notes
  # are written by hand on GitHub, and this only fills in the files and holds the beta flag.
  # `--clobber` so a re-run replaces an asset instead of failing on the name.
  #
  # `!cancelled()` rather than the implicit success(): Windows is knowingly red (README),
  # and uploading the platforms that did build beats uploading nothing. Every artifact is
  # already `if-no-files-found: error`, so nothing half-built reaches this — but all three
  # failing would leave an empty download, hence the check.
  release:
    if: ${{ !cancelled() && inputs.tag != '' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # find rather than a glob, because it doubles as the "nothing built" guard: an
      # unmatched glob would reach gh as a literal path and fail with something unhelpful.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          test -n "$(find artifacts -type f)" || { echo "nothing built, nothing to upload"; exit 1; }
          find artifacts -type f -print0 | xargs -0 gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Beta. The flag lives on the release, and this holds it there rather than
          # trusting a checkbox to have been ticked — an unticked one puts a beta on the
          # repo front page as "Latest". Idempotent, so re-runs and already-marked
          # releases are a no-op. Delete this line at the first stable tag.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
