name: build

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is not in the default set, so marking a draft ready would
    # otherwise never trigger anything and the checks would sit there as skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      build:
        description: Also build and package all three platforms
        type: boolean
        default: false
      tag:
        description: Existing tag — build it and attach the packages to its release
        type: string

jobs:
  # Kept separate from build so a lint failure reads as a lint failure rather than as a
  # broken build, and so it reports in ~2 minutes instead of waiting on the matrix.
  # A draft PR is work in progress and says so; running the checks on every push to one
  # spends minutes to tell you about code you already know is unfinished.
  quality:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # golangci-lint type-checks, so it needs what the package needs to compile. Same
      # target `make install` runs on a Linux checkout, so the recipe lives in one place.
      - name: Install webview build dependencies
        run: make linux-deps

      - name: Cache pinned downloads
        uses: actions/cache@v6
        with:
          path: |
            bin
            .cache
          key: pinned-frankenphp-linux-x86_64-${{ hashFiles('Makefile') }}

      # phpstan reads app/adminer.php for adminer's own symbols, so the downloads have
      # to be in place before it can say anything useful.
      - run: make fetch FRANKEN_ASSET=frankenphp-linux-x86_64

      # php syntax and style, phpstan, golangci-lint, gofmt, go vet, shell syntax.
      - run: make qa FRANKEN_ASSET=frankenphp-linux-x86_64

      # shellcheck is already on the runner and says far more than `sh -n` does.
      - run: shellcheck check.sh

      # Security rules for php, go and leaked secrets. Docker is on the runner and the
      # Makefile pulls semgrep from the public GHCR mirror, so this needs nothing
      # installed and no credentials.
      - run: make security

  # Manual only. Three platforms per commit is minutes spent to learn that a one-line PHP
  # change is still fine, and macOS runners bill at 10x. Run it from the Actions tab: tick
  # the build box for artifacts, or name an existing tag to build that and attach the
  # packages to its release.
  build:
    if: github.event_name == 'workflow_dispatch' && (inputs.build || inputs.tag != '')
    strategy:
      # One red platform should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          # macos-15 runners are Apple Silicon, matching frankenphp-mac-arm64. On an
          # Intel runner the downloaded binary would be the wrong architecture.
          - os: macos-15
            asset: frankenphp-mac-arm64
            package: zip
            artifact: adminer-desktop-macos-arm64
          # Both linux packages off one build: `deb` only re-roots what `dist` already
          # staged, so it costs a dpkg-deb call rather than a second compile.
          - os: ubuntu-24.04
            asset: frankenphp-linux-x86_64
            package: tarball deb
            artifact: adminer-desktop-linux-x86_64
          - os: windows-2025
            asset: frankenphp-windows-x86_64.zip
            package: winzip
            artifact: adminer-desktop-windows-x86_64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The Makefile is written for a POSIX shell; bash ships with the windows runner.
        shell: bash

    steps:
      # An empty ref is the default branch, so this is the same checkout when no tag is
      # named. Unshallow for the tags either way: VERSION is `git describe`, and the .deb
      # takes its version from it. Without the tags that is "dev", which DEB_VERSION
      # strips to nothing and dpkg-deb then refuses.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # webview is cgo, and on linux that means the system GTK and WebKit headers. macOS
      # and windows get theirs from the platform SDK and WebView2, already on the runner.
      # The apt install + webkit2gtk-4.0 shim live in one place: the linux-deps target.
      - name: Install webview build dependencies
        if: runner.os == 'Linux'
        run: make linux-deps

      # frankenphp is a ~180 MB download. It is pinned, so the key only has to change
      # when the pinned version does.
      - name: Cache pinned downloads
        uses: actions/cache@v6
        with:
          path: |
            bin
            .cache
          key: pinned-${{ matrix.asset }}-${{ hashFiles('Makefile') }}

      - run: make fetch FRANKEN_ASSET=${{ matrix.asset }}

      # Before anything else: a mismatch means the release was re-uploaded or the
      # download was tampered with, and neither should reach a build.
      - run: make verify FRANKEN_ASSET=${{ matrix.asset }}

      - run: make qa FRANKEN_ASSET=${{ matrix.asset }}

      # ~2 minutes, and deliberately not shortened. The point is to outlast the ordinary
      # 60s server write timeout, so a faster run would stop proving the thing it exists
      # to prove.
      - run: make check FRANKEN_ASSET=${{ matrix.asset }}

      - run: make ${{ matrix.package }} FRANKEN_ASSET=${{ matrix.asset }}

      # One glob for all three platforms, because every package is now named
      # adminer-desktop_<version>_<os>-<arch>.<ext> (see PKG in the Makefile). It picks up
      # the .deb beside the tarball and never the bare `build/adminer-desktop` binary,
      # which has no underscore.
      # All unsigned: macOS needs right-click > Open on first launch, and Windows shows a
      # SmartScreen warning. Signing needs paid certificates held as repository secrets.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/adminer-desktop_*
          if-no-files-found: error

  # Attaches what the matrix built to the release that already exists for the named tag —
  # draft or published, `gh` finds either. It never creates one: the release and its notes
  # are written by hand on GitHub, and this only fills in the files and holds the beta flag.
  # `--clobber` so a re-run replaces an asset instead of failing on the name.
  #
  # `!cancelled()` rather than the implicit success(): Windows is knowingly red (README),
  # and uploading the platforms that did build beats uploading nothing. Every artifact is
  # already `if-no-files-found: error`, so nothing half-built reaches this — but all three
  # failing would leave an empty download, hence the check.
  release:
    if: ${{ !cancelled() && inputs.tag != '' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # find rather than a glob, because it doubles as the "nothing built" guard: an
      # unmatched glob would reach gh as a literal path and fail with something unhelpful.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          test -n "$(find artifacts -type f)" || { echo "nothing built, nothing to upload"; exit 1; }
          find artifacts -type f -print0 | xargs -0 gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Beta. The flag lives on the release, and this holds it there rather than
          # trusting a checkbox to have been ticked — an unticked one puts a beta on the
          # repo front page as "Latest". Idempotent, so re-runs and already-marked
          # releases are a no-op. Delete this line at the first stable tag.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
