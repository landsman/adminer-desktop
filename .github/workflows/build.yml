name: build

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is not in the default set, so marking a draft ready would
    # otherwise never trigger anything and the checks would sit there as skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      build:
        description: Also build and package all three platforms
        type: boolean
        default: false

jobs:
  # Kept separate from build so a lint failure reads as a lint failure rather than as a
  # broken build, and so it reports in ~2 minutes instead of waiting on the matrix.
  # A draft PR is work in progress and says so; running the checks on every push to one
  # spends minutes to tell you about code you already know is unfinished.
  quality:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    # packages: write so the first run per semgrep version can push the mirror to GHCR;
    # contents: read is the checkout's default, restated because naming any scope drops
    # the rest to none.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # golangci-lint type-checks, so it needs what the package needs to compile. Same
      # target `make install` runs on a Linux checkout, so the recipe lives in one place.
      - name: Install webview build dependencies
        run: make linux-deps

      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: |
            bin
            .cache
          key: pinned-frankenphp-linux-x86_64-${{ hashFiles('Makefile') }}

      # phpstan reads app/adminer.php for adminer's own symbols, so the downloads have
      # to be in place before it can say anything useful.
      - run: make fetch FRANKEN_ASSET=frankenphp-linux-x86_64

      # php syntax and style, phpstan, golangci-lint, gofmt, go vet, shell syntax.
      - run: make qa FRANKEN_ASSET=frankenphp-linux-x86_64

      # shellcheck is already on the runner and says far more than `sh -n` does.
      - run: shellcheck check.sh

      # semgrep only publishes to Docker Hub, which rate-limits anonymous pulls and has
      # downtimes. Mirror the pinned image into GHCR (GitHub's own registry, no Hub
      # limits) once per version, then pull from there on every run. Unlike actions/cache
      # a pushed image persists — no 7-day eviction, so after the first mirror we never
      # reach Docker Hub again until the pinned version bumps.
      - id: semgrep
        run: echo "version=$(grep -oP 'SEMGREP_VERSION = \K.*' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Mirror semgrep into GHCR
        env:
          MIRROR: ghcr.io/${{ github.repository }}/semgrep:${{ steps.semgrep.outputs.version }}
          UPSTREAM: semgrep/semgrep:${{ steps.semgrep.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if docker pull "$MIRROR"; then
            echo "semgrep served from GHCR"
          else
            echo "not mirrored yet — pulling from Docker Hub once, then pushing to GHCR"
            docker pull "$UPSTREAM"
            docker tag "$UPSTREAM" "$MIRROR"
            docker push "$MIRROR"
          fi
          # `make security` runs `docker run semgrep/semgrep:<version>`; tag the GHCR image
          # under that name so it resolves locally and the Makefile stays untouched.
          docker tag "$MIRROR" "$UPSTREAM"

      # Security rules for php, go and leaked secrets. Docker is on the runner and the
      # image is now local (from GHCR), so this needs nothing installed and no Hub pull.
      - run: make security

  # Manual only. Three platforms per commit is minutes spent to learn that a one-line PHP
  # change is still fine, and macOS runners bill at 10x. Run it from the Actions tab with
  # the build box ticked when you actually want artifacts.
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.build
    strategy:
      # One red platform should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          # macos-15 runners are Apple Silicon, matching frankenphp-mac-arm64. On an
          # Intel runner the downloaded binary would be the wrong architecture.
          - os: macos-15
            asset: frankenphp-mac-arm64
            package: zip
            artifact: adminer-desktop-macos-arm64
            path: build/Adminer Desktop.zip
          - os: ubuntu-24.04
            asset: frankenphp-linux-x86_64
            package: tarball
            artifact: adminer-desktop-linux-x86_64
            path: build/adminer-desktop-linux.tar.gz
          - os: windows-2025
            asset: frankenphp-windows-x86_64.zip
            package: winzip
            artifact: adminer-desktop-windows-x86_64
            path: build/adminer-desktop-windows.zip

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The Makefile is written for a POSIX shell; bash ships with the windows runner.
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # webview is cgo, and on linux that means the system GTK and WebKit headers. macOS
      # and windows get theirs from the platform SDK and WebView2, already on the runner.
      # The apt install + webkit2gtk-4.0 shim live in one place: the linux-deps target.
      - name: Install webview build dependencies
        if: runner.os == 'Linux'
        run: make linux-deps

      # frankenphp is a ~180 MB download. It is pinned, so the key only has to change
      # when the pinned version does.
      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: |
            bin
            .cache
          key: pinned-${{ matrix.asset }}-${{ hashFiles('Makefile') }}

      - run: make fetch FRANKEN_ASSET=${{ matrix.asset }}

      # Before anything else: a mismatch means the release was re-uploaded or the
      # download was tampered with, and neither should reach a build.
      - run: make verify FRANKEN_ASSET=${{ matrix.asset }}

      - run: make qa FRANKEN_ASSET=${{ matrix.asset }}

      # ~2 minutes, and deliberately not shortened. The point is to outlast the ordinary
      # 60s server write timeout, so a faster run would stop proving the thing it exists
      # to prove.
      - run: make check FRANKEN_ASSET=${{ matrix.asset }}

      - run: make ${{ matrix.package }} FRANKEN_ASSET=${{ matrix.asset }}

      # All unsigned: macOS needs right-click > Open on first launch, and Windows shows a
      # SmartScreen warning. Signing needs paid certificates held as repository secrets.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
