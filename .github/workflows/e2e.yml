name: e2e

# Nightly, not per pull request. The browser checks boot a postgres, a server and a webkit
# per file — minutes, on every push, to re-prove what the last run already proved about code
# that mostly does not touch the UI. Once a night catches the same regression by morning,
# and the Actions tab has the button for when you want it now.
#
# Its own workflow rather than a job in build.yml: nothing here shares a step with the
# packaging matrix, and a schedule bolted onto that file would have every job in it carrying
# an `if:` to say which trigger it answers to.
on:
  schedule:
    # 21:30 UTC — 23:30 in Prague through the summer, 22:30 once the clocks go back. GitHub
    # cron is UTC and has no timezone, so the choice is which half of the year to be right in.
    - cron: "30 21 * * *"
  workflow_dispatch:
  # Only when the suite itself could break: this file (a nightly that has never run is one
  # nobody knows is broken), the scenarios, steps and config under tests/e2e, and the composer
  # lock that pins behat and playwright-php — a behat bump once broke `make e2e` with nothing
  # to say so until somebody ran it — and patches/, which changes adminer itself.
  # A draft is still changing, so its runs are billed for nothing: skipped below, and
  # ready_for_review, which is not a default type, runs the suite once it stops being one.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/e2e.yml"
      - "tests/e2e/**"
      - "app/composer.lock"
      - "patches/**"

# A new push to a pull request makes the run still going on it worthless; on GitHub that
# run is billed to the end anyway. A dispatch or schedule is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # docker pull, then the suite twice, against the checkout and then the packaged app/. The
    # default is 6 hours, which is what a wedged run costs before anyone looks.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The same toolchain a developer gets: node for the browser Playwright drives, and gh,
      # which `mise run install` checks is logged in before it spends anything.
      - uses: jdx/mise-action@v4

      # frankenphp is a ~180 MB download, pinned in the Makefile — so is everything else
      # under .cache, and the key only has to change when a pin does.
      - name: Cache pinned downloads
        uses: actions/cache@v6
        with:
          path: |
            bin
            .cache
          key: pinned-frankenphp-linux-x86_64-${{ hashFiles('Makefile') }}

      # Before `mise run install`: composer runs on the bundled frankenphp, so app/vendor
      # cannot be built until the binary is here.
      - run: make fetch FRANKEN_ASSET=frankenphp-linux-x86_64

      # composer deps, npm deps, and the webkit Playwright launches.
      - run: mise run install
        env:
          GH_TOKEN: ${{ github.token }}

      # Playwright ships its own webkit but not the system libraries it links against, and
      # the runner image has few of them: it carries Chrome, not a WebKit. A no-op when they all happen
      # to be there, which is why it is not worth guessing. Deliberately not in
      # `mise run install`: that runs on developer machines, and this installs with sudo apt.
      # Takes under a minute. It has hung on apt, which otherwise bills the job's whole 30 minutes.
      - name: Playwright system libraries
        timeout-minutes: 5
        working-directory: app/vendor/playwright-php/playwright/bin
        run: npx --no-install playwright install-deps webkit

      # Boots its own postgres and mysql in docker (tests/e2e/harness/fixture.php), so there is
      # no service to declare here. Linux only, and that is the whole story: the scenarios drive
      # frankenphp and a headless webkit, never the native shell, so a second platform would
      # re-run the same assertions — at 10x on macOS.
      - run: make e2e FRANKEN_ASSET=frankenphp-linux-x86_64

      # Again, against app/ as a release ships it: precompiled templates in a read-only tree, where a
      # template the build missed is a fatal page. Nightly only — a pull request here changes the
      # suite, which the run above already proves — and after a red first run too, so one night
      # says whether both broke.
      - if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: make e2e-packaged FRANKEN_ASSET=frankenphp-linux-x86_64

      # A failed step names the scenario and the step; the picture and the HTML beside it are the
      # only way to see what the page actually looked like on a runner nobody was watching.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts
          if-no-files-found: ignore
