name: dependabot title

# Names what a Dependabot PR bumps instead of "the composer group", since the
# squash-merge makes the title the subject on main. The workflow and its script
# live in landsman/config, shared with every repo of mine.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retitle:
    # A called workflow holds no more than this grants.
    permissions:
      contents: read
      pull-requests: write
    uses: landsman/config/.github/workflows/dependabot-title.yml@main
