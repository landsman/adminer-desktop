name: windows-ci

# The gate's Windows half is the part no other job runs: its directory's ACL, the socket between
# two Go processes, and the bundled PHP reporting over loopback. Only when that code changes,
# since a Windows runner is billed double.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - launcher/mcpgate/**
      - launcher/mcpbridge/**
      - launcher/datadir/**
      - app/src/Mcp/Endpoint.php
      - app/src/Mcp/GateReport.php
      - app/src/Env.php
      # What the job builds with: the frankenphp pin, the Go toolchain.
      - Makefile
      - go.mod
      - go.sum
      - mise.toml
      - .github/workflows/windows-ci.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # Go alone: this job needs neither node nor gh, and a Windows minute is billed double.
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: Cache pinned downloads
        uses: actions/cache@v6
        with:
          path: |
            bin
            .cache
          key: pinned-frankenphp-windows-x86_64.zip-${{ hashFiles('Makefile') }}
      - run: make go-test FRANKEN_ASSET=frankenphp-windows-x86_64.zip
        env:
          REQUIRE_BUNDLED_PHP: 1
