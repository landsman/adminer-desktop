<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<!-- The activity indicator (css/busy.css turns it): the native one's twelve spokes, the
		brightest leading, in the native grey, which reads on a light panel and a dark one alike. -->
	<g fill="#8e8e93">
		<rect x="14.5" y="2" width="3" height="8" rx="1.5" opacity=".21"/>
		<rect x="14.5" y="2" width="3" height="8" rx="1.5" opacity=".29" transform="rotate(30 16 16)"/>
		<rect x="14.5" y="2" width="3" height="8" rx="1.5" opacity=".36" transform="rotate(60 16 16)"/>
		<rect x="14.5" y="2" width="3" height="8" rx="1.5" opacity=".43" transform="rotate(90 16 16)"/>
		<rect x="14.5" y="2" width="3" height="8" rx="1.5" opacity=".5" transform="rotate(120 16 16)"/>
		<rect x="14.5" y="2" width="3" height="8" rx="1.5" opacity=".57" transform="rotate(150 16 16)"/>
		<rect x="14.5" y="2" width="3" height="8" rx="1.5" opacity=".64" transform="rotate(180 16 16)"/>
		<rect x="14.5" y="2" width="3" height="8" rx="1.5" opacity=".71" transform="rotate(210 16 16)"/>
		<rect x="14.5" y="2" width="3" height="8" rx="1.5" opacity=".79" transform="rotate(240 16 16)"/>
		<rect x="14.5" y="2" width="3" height="8" rx="1.5" opacity=".86" transform="rotate(270 16 16)"/>
		<rect x="14.5" y="2" width="3" height="8" rx="1.5" opacity=".93" transform="rotate(300 16 16)"/>
		<rect x="14.5" y="2" width="3" height="8" rx="1.5" transform="rotate(330 16 16)"/>
	</g>
</svg>
